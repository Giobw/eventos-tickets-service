name: CI/CD - Tickets Service

# Se ejecuta con cada push a la rama principal (y manualmente si se necesita)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: eventos-tickets-service

jobs:
  # 1) Compilar y ejecutar pruebas unitarias
  test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify
        run: mvn -B verify

  # 2) Construir la imagen Docker y publicarla en Docker Hub
  docker:
    name: Construir y publicar imagen Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 3) Desplegar automáticamente en la instancia EC2 (con el EFS montado en /mnt/efs)
  deploy:
    name: Desplegar en EC2
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar vía SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,S3_BUCKET,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            set -e
            IMAGE="$DOCKERHUB_USERNAME/eventos-tickets-service:latest"

            # El EFS debe estar montado en el host (ver README, sección EFS)
            mountpoint -q /mnt/efs || { echo "ERROR: EFS no está montado en /mnt/efs"; exit 1; }
            mkdir -p "$HOME/tickets-data"

            # Credenciales explícitas solo si se entregaron como secrets;
            # en caso contrario el SDK usa el rol de la instancia EC2.
            AWS_ENV=""
            if [ -n "$AWS_ACCESS_KEY_ID" ]; then
              AWS_ENV="-e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
            fi

            docker pull "$IMAGE"
            docker stop tickets-service 2>/dev/null || true
            docker rm tickets-service 2>/dev/null || true

            docker run -d --name tickets-service --restart unless-stopped \
              -p 8080:8080 \
              -v /mnt/efs:/app/efs \
              -v "$HOME/tickets-data":/app/data \
              -e S3_BUCKET="$S3_BUCKET" \
              -e AWS_REGION="${AWS_REGION:-us-east-1}" \
              $AWS_ENV \
              "$IMAGE"

            # Verificación de salud
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "Servicio saludable"; exit 0
              fi
              sleep 5
            done
            echo "ERROR: el servicio no respondió"; docker logs --tail 50 tickets-service; exit 1
